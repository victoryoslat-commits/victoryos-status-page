# Change these first
owner: victoryoslat-commits # Your GitHub organization or username, where this repository lives
repo: victoryos-status-page # The name of this repository

sites:
  - name: "VictoryOS Landing Page"
    url: https://victoryos.io
  - name: "VictoryOS App Page"
    url: https://app.victoryos.io
  - name: "VictoryOS Supabase Backend"
    url: https://ivplmwwzoqkdfdvjimwg.supabase.co/functions/v1/supabase-health
    expectedStatusCodes:
      - 200
  - name: "TEST Alerta Email (BORRAR)"
    url: https://victoryos.io
    expectedStatusCodes:
      - 999

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /victoryos-status-page
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: VictoryOS Status
  introTitle: "Welcome to **VictoryOS** Status Page."
  introMessage: Real-time status and uptime monitoring for all our services.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/victoryoslat-commits/victoryos
    - title: Website
      href: https://victoryos.io

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration

# Customize monitoring schedule (cron syntax)
workflowSchedule:
  graphs: "0 0 * * *"         # Daily graphs at midnight
  responseTime: "0 23 * * *"   # Daily response time at 11 PM
  staticSite: "0 1 * * *"      # Daily site rebuild at 1 AM
  summary: "0 0 * * *"         # Daily summary at midnight
  updateTemplate: "0 0 * * *"  # Daily template check
  updates: "0 3 * * *"         # Daily updates at 3 AM
  uptime: "*/5 * * * *"        # Check uptime every 5 minutes

commitMessages:
  commitAuthorName: "Upptime Bot"
  commitAuthorEmail: "bot@victoryos.io"
